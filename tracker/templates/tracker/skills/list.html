{% extends "app_base.html" %}
{% block title %}Skills · Applicant Tracking System{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="flex items-center justify-between gap-4 mb-4">
    <h1 class="text-2xl font-bold">Skills</h1>
    <a href="{% url 'tracker:skill_create' %}" class="btn btn-primary">New skill</a>
  </div>
  {% include "tracker/_messages.html" %}
  <div class="card bg-base-100 shadow">
    <div class="overflow-x-auto">
      <table class="table">
        <thead><tr><th>Name</th><th class="text-right">Actions</th></tr></thead>
        <tbody>
          {% for skill in skills %}
          <tr class="hover">
            <td class="font-medium">{{ skill.name }}</td>
            <td class="text-right"><a href="{% url 'tracker:skill_edit' skill.pk %}" class="btn btn-xs btn-outline">Rename</a></td>
          </tr>
          {% empty %}
          <tr><td colspan="2" class="text-center opacity-70">No skills yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
