{% extends "base.html" %}
{% block body %}
<div class="navbar bg-base-100 shadow-sm px-4">
  <div class="flex-1 gap-2 items-center flex">
    <a href="{% url 'tracker:home' %}" class="btn btn-ghost text-lg">Applicant Tracker</a>
    <ul class="menu menu-horizontal px-1">
      <li><a href="{% url 'tracker:application_workspace' %}">Workspace</a></li>
      <li><a href="{% url 'tracker:candidate_list' %}">Candidates</a></li>
      <li><a href="{% url 'tracker:job_list' %}">Job Openings</a></li>
      {% if user.is_admin %}
      <li><a href="{% url 'tracker:skill_list' %}">Skills</a></li>
      {% endif %}
    </ul>
  </div>
  <div class="flex-none flex items-center gap-3">
    <span class="text-sm">
      Signed in as <strong>{{ user.username }}</strong>
      <span class="badge badge-sm badge-outline">{{ user.get_role_display }}</span>
    </span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-outline">Log out</button>
    </form>
  </div>
</div>
<main class="container mx-auto p-6">
  {% block content %}{% endblock %}
</main>
{% endblock %}
